[project]
name = "ai-partner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorama>=0.4.6",
    "platformdirs>=4.11.0",
    "plyer>=2.1.0",
    "pyfiglet>=1.0.4",
    "quo>=2023.5.1",
    "setuptools>=83.0.0",
    "sqlite-utils>=4.1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# 👇 the rules causing the sqlite-utils errors
reportAttributeAccessIssue = false
reportGeneralTypeIssues = false

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "ANN",  # type annotations
    "B",    # bugbear (catches bugs!)
    "C4",   # flake8-comprehensions
    "SIM",  # simplify
    "TCH",  # type-checking
]
ignore = []
